# Every pull request and push to main: lint, then the tests on Linux, Windows
# and macOS. A version tag (v*) also builds every installer and publishes them
# as a GitHub Release with checksums and build provenance. In the Actions tab,
# "Run workflow" with "build" ticked builds the installers without releasing.
#
# Security notes for a public repo:
# - jobs get a read-only token; only the release job can write, and only on tags
# - the Google client secrets are only used by tag / manual builds, which pull
#   requests (including forks) never run
# - third-party actions are pinned to commit SHAs (Dependabot keeps them fresh)
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: "Also build every installer (no release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.10
      - run: ruff check companion scripts tests

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r windows/requirements-build.txt
      - run: python -m pytest -q
      - name: Health check
        run: python -m companion --doctor --quiet

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build == true
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress
        continue-on-error: true
      - name: Google client (from secrets; never stored in git)
        env:
          PISI_GOOGLE_CLIENT_ID: ${{ secrets.PISI_GOOGLE_CLIENT_ID }}
          PISI_GOOGLE_CLIENT_SECRET: ${{ secrets.PISI_GOOGLE_CLIENT_SECRET }}
        run: python scripts/stage_google_client.py
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1 -SkipTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PISI-windows
          path: dist/PISI-Setup-*.exe

  build-mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build == true
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon (M1 and newer)
          - runner: macos-15-intel      # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Google client (from secrets; never stored in git)
        env:
          PISI_GOOGLE_CLIENT_ID: ${{ secrets.PISI_GOOGLE_CLIENT_ID }}
          PISI_GOOGLE_CLIENT_SECRET: ${{ secrets.PISI_GOOGLE_CLIENT_SECRET }}
        run: python scripts/stage_google_client.py
      - name: Build
        env:
          PYTHON: python
        run: bash mac/build.sh --skip-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PISI-mac-${{ matrix.runner }}
          path: dist/*.dmg

  build-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || inputs.build == true
    timeout-minutes: 40
    runs-on: ubuntu-22.04          # an older glibc: the AppImage runs on more distros
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Qt system libraries (to build against; bundled into the AppImage)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0 file
      - name: Google client (from secrets; never stored in git)
        env:
          PISI_GOOGLE_CLIENT_ID: ${{ secrets.PISI_GOOGLE_CLIENT_ID }}
          PISI_GOOGLE_CLIENT_SECRET: ${{ secrets.PISI_GOOGLE_CLIENT_SECRET }}
        run: python scripts/stage_google_client.py
      - name: Build
        env:
          PYTHON: python
        run: bash linux/build-appimage.sh --skip-tests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: PISI-linux
          path: dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the build provenance
      attestations: write    # publish it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
      - name: Collect the installers and their checksums
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'PISI-Setup-*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} release/ \;
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
      - name: Build provenance (gh attestation verify <file> --repo <this repo>)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/PISI-*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "PISI ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
