name: Something's not right
description: A bug, a crash, or the cat doing something odd
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! Found a security problem? Please don't post it here: see [SECURITY.md](https://github.com/erkambo/pisi/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead. A screenshot or a short clip helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      placeholder: |
        1. Start a focus block
        2. Open a web page
        3. ...
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      options: [Windows 10/11, macOS (Apple Silicon), macOS (Intel), Linux, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PISI version
      description: The first line of doctor.txt shows it (or run PISI with --version)
  - type: textarea
    id: doctor
    attributes:
      label: doctor.txt
      description: Run PISI with --doctor and paste what it writes. It holds no window titles, file names or personal details.
      render: text
